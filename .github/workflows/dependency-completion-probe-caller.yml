# TEMPORARY: retire after the completion delivery experiment.
name: Dependency Completion Probe Caller
run-name: Completion delivery probe caller ${{ inputs.expected_head }}
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact protected main SHA for the temporary diagnostic
        type: string
        required: true
permissions: {}
concurrency:
  group: dependency-completion-probe-caller-${{ inputs.expected_head }}
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify owner caller and request harmless parent once
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: infra/dependency-ci
          COMPLETION_PROBE_KIND: caller
        run: python3 -B -m dependency_updates.completion_probe
