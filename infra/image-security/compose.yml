name: sifto-image-security
services:
  trivy:
    image: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    user: "${IMAGE_SECURITY_UID:?Set the caller UID}:${IMAGE_SECURITY_GID:?Set the caller GID}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes:
      - ${IMAGE_SECURITY_DIR:-../../.image-security/test}/image.tar:/input/image.tar:ro
      - ${IMAGE_SECURITY_DIR:-../../.image-security/test}:/reports
      # Overlay the archive's reports alias so the writable output mount cannot
      # grant write access to the same archive through a second path.
      - ${IMAGE_SECURITY_DIR:-../../.image-security/test}/image.tar:/reports/image.tar:ro
      - ${IMAGE_SECURITY_CACHE_DIR:-../../.image-security/cache}:/cache
    environment:
      TRIVY_CACHE_DIR: /cache
  verifier:
    image: python:3.12.15-slim
    user: "${IMAGE_SECURITY_UID:?Set the caller UID}:${IMAGE_SECURITY_GID:?Set the caller GID}"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes:
      - .:/tool:ro
      - ${IMAGE_SECURITY_DIR:-../../.image-security/test}:/reports
      - ${IMAGE_SECURITY_DIR:-../../.image-security/test}/image.tar:/reports/image.tar:ro
    environment:
      IMAGE_COMPONENT:
      IMAGE_SECURITY_UID:
      IMAGE_SECURITY_GID:
