worker_processes  auto;

error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;
daemon off;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    map $request_uri $loggable {
        /healthcheck 0;
        default 1;
    }

    access_log  /dev/stdout main if=$loggable;
    client_max_body_size 100M;
    client_body_temp_path /tmp/coolify-nginx-client;
    proxy_temp_path /tmp/coolify-nginx-proxy;
    fastcgi_temp_path /tmp/coolify-nginx-fastcgi;
    uwsgi_temp_path /tmp/coolify-nginx-uwsgi;
    scgi_temp_path /tmp/coolify-nginx-scgi;

    sendfile        on;
    keepalive_timeout  65;
    include /etc/nginx/conf.d/*.conf;
}
