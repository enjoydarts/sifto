name: sifto-renovate-npm-fixture
services:
  test:
    image: node:22.23.4-alpine
    user: '1000:1000'
    entrypoint: [node]
    command: [/fixtures/test-renovate-npm-resolution.mjs]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700,size=256m
    volumes:
      - ../../renovate.json:/fixtures/renovate.json:ro
      - ./test-renovate-npm-resolution.mjs:/fixtures/test-renovate-npm-resolution.mjs:ro
