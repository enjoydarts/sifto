name: Dependency Approve Merge and Deploy
run-name: Dependency PR ${{ inputs.pr_number }} ${{ inputs.head_sha }} ${{ inputs.base_sha }}
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Same-repository dependency PR number
        required: true
        type: string
      head_sha:
        description: Exact candidate head SHA
        required: true
        type: string
      base_sha:
        description: Exact current main base SHA
        required: true
        type: string
      source_sha:
        description: Trusted main workflow source SHA
        required: true
        type: string
permissions: {}
concurrency:
  group: dependency-approval-${{ inputs.pr_number }}-${{ inputs.head_sha }}-${{ inputs.base_sha }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    # PR CI keeps its shared 50m deadline while all-image evidence runs in
    # parallel with an independent 80m bound; 10m for API/setup.
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
      statuses: read
      actions: write
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      plan_hash: ${{ steps.plan.outputs.plan_hash }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate dependencies and explicitly run exact-head read-only CI
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ inputs.pr_number }}
          INPUT_HEAD: ${{ inputs.head_sha }}
          INPUT_BASE: ${{ inputs.base_sha }}
          INPUT_SOURCE: ${{ inputs.source_sha }}
          DEPENDENCY_PR_CI_AUTO_APPROVAL: ${{ vars.DEPENDENCY_PR_CI_AUTO_APPROVAL }}
          PYTHONPATH: infra/dependency-ci
        run: python3 -B -m dependency_updates.pipeline prepare
  owner-approval:
    if: github.ref == 'refs/heads/main'
    needs: prepare
    environment: production-maintenance
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Record native owner approval
        run: printf '%s\n' 'Native owner approval recorded.'
  approve-merge-deploy:
    if: github.ref == 'refs/heads/main'
    needs: [prepare, owner-approval]
    # Approval happens before this repository-wide write lock. Keep approved
    # pending jobs queued instead of replacing the previous pending apply.
    concurrency:
      group: dependency-production-apply
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-26.04
    # Deploy 145m + Audio 50m + image evidence 80m + 10m setup allowance.
    timeout-minutes: 285
    permissions:
      contents: write
      pull-requests: write
      statuses: read
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify native owner approval and unchanged plan, merge once, then deploy
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_PLAN: ${{ needs.prepare.outputs.plan }}
          PREPARED_HASH: ${{ needs.prepare.outputs.plan_hash }}
          PYTHONPATH: infra/dependency-ci
        run: python3 -B -m dependency_updates.pipeline execute
