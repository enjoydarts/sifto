name: Dependency Check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_head:
        description: Optional immutable candidate head guard
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: dependency-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  api:
    name: Dependency API
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate dispatched immutable head
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: test -z "$EXPECTED_HEAD" || test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - run: make dependency-api
      - if: always()
        run: make dependency-clean
  worker:
    name: Dependency Worker
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate dispatched immutable head
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: test -z "$EXPECTED_HEAD" || test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - run: make dependency-worker
      - if: always()
        run: make dependency-clean
  web:
    name: Dependency Web
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate dispatched immutable head
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: test -z "$EXPECTED_HEAD" || test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - run: make dependency-web
      - if: always()
        run: make dependency-clean
  policy:
    name: Dependency Policy
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate dispatched immutable head
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: test -z "$EXPECTED_HEAD" || test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      # The real bootstrap installer accepts ARM64 Ubuntu 24 only.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - env:
          # Run the offline loader natively on this AMD64 policy runner.
          POSTGRES_MOUNT_TEST_PLATFORM: linux/amd64
        run: |
          make dependency-python-locks-check
          make dependency-python-locks-test
          make dependency-contract
          make dependency-renovate-validate
          make dependency-audio
          make maintenance-test
          make maintenance-syntax
          make maintenance-bootstrap-test
          make maintenance-backup-test
          make maintenance-postgres-data-mount-test
          make image-security-test
      - if: always()
        run: make dependency-clean
