# TEMPORARY: retire after the completion delivery experiment.
name: Dependency Completion Delivery Probe
run-name: Dependency completion probe ${{ inputs.caller_run_id }}
on:
  workflow_dispatch:
    inputs:
      caller_run_id:
        description: First owner diagnostic caller run identifier
        type: string
        required: true
      source_sha:
        description: Exact protected main diagnostic source SHA
        type: string
        required: true
permissions: {}
concurrency:
  group: dependency-completion-probe-parent-${{ inputs.caller_run_id }}
  cancel-in-progress: false
jobs:
  harmless:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify temporary parent and finish harmlessly
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: infra/dependency-ci
          COMPLETION_PROBE_KIND: parent
        run: python3 -B -m dependency_updates.completion_probe
