name: Repair Migration 133 Dirty State

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-migration-133-dirty:
    name: Repair dirty migration state at 133
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Install golang-migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.18.1/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/migrate

      - name: Check Tailscale connectivity
        run: tailscale status

      - name: Wait for database connectivity
        env:
          MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
        run: |
          set -euo pipefail
          read -r db_host db_port < <(
            python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          parsed = urlparse(os.environ["MIGRATE_DATABASE_URL"])
          if not parsed.hostname:
              raise SystemExit("MIGRATE_DATABASE_URL does not contain a hostname")
          print(parsed.hostname, parsed.port or 5432)
          PY
          )

          echo "Checking Tailscale path to ${db_host}..."
          if ! tailscale ping --c 3 --timeout=10s "$db_host"; then
            echo "::warning::Tailscale ping to ${db_host} failed; continuing with the TCP check."
          fi

          connected=false
          for attempt in $(seq 1 6); do
            echo "Checking PostgreSQL TCP connectivity to ${db_host}:${db_port} (${attempt}/6)..."
            # $1 and $2 are expanded by the child Bash process.
            # shellcheck disable=SC2016
            if timeout 5 bash -c 'exec 3<>"/dev/tcp/$1/$2"' _ "$db_host" "$db_port"; then
              connected=true
              break
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 5
            fi
          done

          if [ "$connected" != true ]; then
            echo "::error::PostgreSQL is unreachable at ${db_host}:${db_port} after 6 attempts."
            exit 1
          fi
          echo "PostgreSQL is reachable at ${db_host}:${db_port}."

      - name: Repair dirty migration state and rerun 133
        env:
          MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
        run: |
          set -euo pipefail
          migrate -path db/migrations -database "$MIGRATE_DATABASE_URL" force 132
          migrate -path db/migrations -database "$MIGRATE_DATABASE_URL" up
          migrate -path db/migrations -database "$MIGRATE_DATABASE_URL" version
