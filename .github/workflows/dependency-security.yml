name: Dependency Security Advisory
run-name: ${{ inputs.parent_run && format('Dependency image scan {0} {1} {2}', inputs.parent_run, inputs.phase, inputs.expected_head) || format('Dependency Security Advisory {0}', github.sha) }}
on:
  schedule:
    - cron: '40 0 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_head:
        description: Optional exact source SHA; required for native pipeline scans
        required: false
        type: string
      parent_run:
        description: Native dependency approval run ID; paired with phase
        required: false
        type: string
      phase:
        description: Native candidate or merged phase; paired with parent_run
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ inputs.parent_run && format('dependency-security-{0}-{1}-{2}', inputs.parent_run, inputs.phase, inputs.expected_head) || 'dependency-security' }}
  cancel-in-progress: false
jobs:
  images:
    # Manual runs on public branches are read-only and enable end-to-end testing.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        component: [api, worker, audio-concat, maintenance, web]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify requested scan source and dispatch identity
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          PARENT_RUN: ${{ inputs.parent_run }}
          SCAN_PHASE: ${{ inputs.phase }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [ -n "$EXPECTED_HEAD" ]; then
            printf '%s' "$EXPECTED_HEAD" | LC_ALL=C grep -Eq '^[0-9a-f]{40}$'
            test "$EXPECTED_HEAD" = "$GITHUB_SHA"
          fi
          if [ -n "$PARENT_RUN" ] || [ -n "$SCAN_PHASE" ]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test -n "$EXPECTED_HEAD"
            printf '%s' "$PARENT_RUN" | LC_ALL=C grep -Eq '^[1-9][0-9]{0,19}$'
            case "$SCAN_PHASE" in candidate|merged) ;; *) exit 1 ;; esac
          fi
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Verify archive identity and scan evidence validation
        run: make image-security-test
      - name: Build final production image archive for deployment platform
        env:
          IMAGE_COMPONENT: ${{ matrix.component }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: make image-security-build
      - name: Generate SBOM and scan final image OS and library vulnerabilities
        env:
          IMAGE_COMPONENT: ${{ matrix.component }}
        run: make image-security-scan
      - name: Publish image inventory summary
        if: always()
        env:
          IMAGE_COMPONENT: ${{ matrix.component }}
        run: |
          if [ -f ".image-security/$IMAGE_COMPONENT/summary.md" ]; then
            cat ".image-security/$IMAGE_COMPONENT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' "Image inventory incomplete for $IMAGE_COMPONENT; inspect build/scan errors and attached artifacts." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve SBOM, findings and immutable image correlation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-security-${{ matrix.component }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .image-security/${{ matrix.component }}/*.json
            .image-security/${{ matrix.component }}/*.txt
            .image-security/${{ matrix.component }}/*.md
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
  # Keep this advisory inventory separate from required functional PR checks.
  # Findings fail the job and need human triage; no baseline CVEs are suppressed.
  inventory:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Stage public dependency manifests only
        run: make dependency-inventory
      - name: Scan all known package vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.75.0'
          scan-type: fs
          scan-ref: .dependency-inventory
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table
          output: .dependency-vulnerabilities.txt
          cache: false
      - name: Publish package and CVE inventory in summary
        if: always()
        run: |
          printf '%s\n' '## Dependency vulnerability inventory' 'Findings require human review. This advisory is separate from functional PR checks.' '```text' >> "$GITHUB_STEP_SUMMARY"
          if [ -f .dependency-vulnerabilities.txt ]; then
            cat .dependency-vulnerabilities.txt >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'The scanner did not produce a report. Inspect the failed scan step.' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '%s\n' '```' >> "$GITHUB_STEP_SUMMARY"
          # Missing/empty output is scanner incompleteness, not a CVE advisory.
          test -s .dependency-vulnerabilities.txt
