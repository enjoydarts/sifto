name: Deploy
run-name: Approved dependency deployment ${{ inputs.approval_run }} ${{ inputs.expected_commit || github.sha }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact approved merged main commit
        required: true
        type: string
      approval_run:
        description: Native dependency approval workflow run
        required: true
        type: string
      approved_pr:
        description: Approved dependency PR number
        required: true
        type: string
      approved_head:
        description: Approved dependency head SHA
        required: true
        type: string
      approved_base:
        description: Approved dependency base SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  EXPECTED_COMMIT: ${{ inputs.expected_commit || github.sha }}
  APPROVAL_RUN: ${{ inputs.approval_run }}
  APPROVED_PR: ${{ inputs.approved_pr }}
  APPROVED_HEAD: ${{ inputs.approved_head }}
  APPROVED_BASE: ${{ inputs.approved_base }}
  PYTHONPATH: infra/dependency-ci

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    name: Validate deployment configuration
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      deploy_api: ${{ steps.authorize.outputs.deploy_api }}
      deploy_worker: ${{ steps.authorize.outputs.deploy_worker }}
      deploy_web: ${{ steps.authorize.outputs.deploy_web }}
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_WORKER_UUID: ${{ vars.COOLIFY_WORKER_UUID }}
      COOLIFY_API_UUID: ${{ vars.COOLIFY_API_UUID }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      INNGEST_API_KEY: ${{ secrets.INNGEST_API_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact main and native approval
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B -m dependency_updates.deploy validate
      - name: Check required settings
        run: |
          set -euo pipefail
          missing=0
          for name in COOLIFY_URL COOLIFY_WORKER_UUID COOLIFY_API_UUID COOLIFY_TOKEN INNGEST_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured."
              missing=1
            fi
          done
          exit "$missing"

  migrate:
    name: Run DB migrations
    needs: validate
    if: needs.validate.outputs.deploy_api == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Connect Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Install golang-migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.18.1/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/migrate

      - name: Check Tailscale connectivity
        run: tailscale status

      - name: Wait for database connectivity
        env:
          MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
        run: |
          set -euo pipefail
          read -r db_host db_port < <(
            python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          parsed = urlparse(os.environ["MIGRATE_DATABASE_URL"])
          if not parsed.hostname:
              raise SystemExit("MIGRATE_DATABASE_URL does not contain a hostname")
          print(parsed.hostname, parsed.port or 5432)
          PY
          )

          # Accept DERP as well as direct paths; newly joined peers may take time to propagate.
          # Keep ping diagnostic-only so it cannot prevent a working DB TCP connection.
          ping_ok=false
          for attempt in $(seq 1 3); do
            echo "Checking Tailscale path to ${db_host} (${attempt}/3)..."
            if tailscale ping --c 1 --timeout=10s --until-direct=false "$db_host"; then
              ping_ok=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Tailscale ping has not succeeded yet; retrying in 5s for peer propagation."
              sleep 5
            fi
          done

          connected=false
          for attempt in $(seq 1 6); do
            echo "Checking PostgreSQL TCP connectivity to ${db_host}:${db_port} (${attempt}/6)..."
            # $1 and $2 are expanded by the child Bash process.
            # shellcheck disable=SC2016
            if timeout 5 bash -c 'exec 3<>"/dev/tcp/$1/$2"' _ "$db_host" "$db_port"; then
              connected=true
              break
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 5
            fi
          done

          if [ "$connected" != true ]; then
            echo "::error::PostgreSQL is unreachable at ${db_host}:${db_port} after 6 attempts."
            echo "Tailscale ping succeeded: ${ping_ok}. Current Tailscale status:"
            tailscale status || true
            exit 1
          fi
          echo "PostgreSQL is reachable at ${db_host}:${db_port}."
          if [ "$ping_ok" != true ]; then
            echo "::notice::Tailscale ping to ${db_host} did not succeed after 3 attempts, but PostgreSQL TCP connectivity succeeded; continuing with migrations."
          fi

      - name: Run migrations
        env:
          MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
        run: migrate -path db/migrations -database "$MIGRATE_DATABASE_URL" up

  deploy-worker:
    name: Deploy and verify exact worker commit
    needs: [validate, migrate]
    if: always() && needs.validate.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') && needs.validate.outputs.deploy_worker == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pin Coolify source, deploy once, verify commit and health
        env:
          GH_TOKEN: ${{ github.token }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_WORKER_UUID: ${{ vars.COOLIFY_WORKER_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: python3 -B -m dependency_updates.deploy worker

  deploy-api:
    name: Deploy and verify exact api commit
    needs: [validate, migrate, deploy-worker]
    if: always() && needs.validate.result == 'success' && needs.migrate.result == 'success' && (needs.deploy-worker.result == 'success' || needs.deploy-worker.result == 'skipped') && needs.validate.outputs.deploy_api == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pin Coolify source, deploy once, verify commit and health
        env:
          GH_TOKEN: ${{ github.token }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_API_UUID: ${{ vars.COOLIFY_API_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: python3 -B -m dependency_updates.deploy api

  deploy-web:
    if: always() && needs.validate.result == 'success' && (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped') && (needs.deploy-worker.result == 'success' || needs.deploy-worker.result == 'skipped') && needs.validate.outputs.deploy_web == 'true'
    name: Deploy and verify exact Web commit
    needs: [validate, deploy-api, deploy-worker]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Explicit immutable Vercel deployment after Bot merge
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: python3 -B -m dependency_updates.deploy web

  sync-inngest:
    name: Sync Inngest
    needs: deploy-api
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      INNGEST_API_KEY: ${{ secrets.INNGEST_API_KEY }}
    steps:
      - name: Sync Inngest app
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $INNGEST_API_KEY" \
            -H "Content-Type: application/json" \
            --data '{"url":"https://api.sifto.net/api/inngest"}' \
            "https://api.inngest.com/v2/apps/sifto-api/syncs" > /dev/null
